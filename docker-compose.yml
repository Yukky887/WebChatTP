services:

  postgres:
    image: postgres:16-alpine
    container_name: parts-ai-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-partsai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-partsai_secret}
      POSTGRES_DB: ${POSTGRES_DB:-partsai}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-partsai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - parts-ai-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: parts-ai-backend
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=${QDRANT_URL:-http://192.168.128.123:6333}
      - WEAVIATE_URL=${WEAVIATE_URL:-http://192.168.128.123:6789}
      - OLLAMA_URL=${OLLAMA_URL:-http://192.168.128.123:6790}
      - LLAMACPP_URL=${LLAMACPP_URL:-http://192.168.0.254:8080/v1}
      - ROUTERAI_URL=${ROUTERAI_URL:-https://routerai.ru/api/v1}
      - ROUTERAI_API_KEY=${ROUTERAI_API_KEY:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - EMBEDDING_DOCS_MODEL=${EMBEDDING_DOCS_MODEL:-BAAI/bge-m3}
      - EMBEDDING_TICKETS_MODEL=${EMBEDDING_TICKETS_MODEL:-qwen/qwen3-embedding-4b}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-partsai}:${POSTGRES_PASSWORD:-partsai_secret}@postgres:5432/${POSTGRES_DB:-partsai}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - embedding_cache:/root/.cache
    restart: unless-stopped
    networks:
      - parts-ai-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: parts-ai-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - parts-ai-network

volumes:
  embedding_cache:
  postgres_data:

networks:
  parts-ai-network:
    driver: bridge