version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: parts-ai-backend
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=${QDRANT_URL:-http://192.168.128.123:6333}
      - WEAVIATE_URL=${WEAVIATE_URL:-http://192.168.128.123:6789}
      - OLLAMA_URL=${OLLAMA_URL:-http://192.168.128.123:6790}
      - LLAMACPP_URL=${LLAMACPP_URL:-http://192.168.0.254:8080/v1}
      - ROUTERAI_URL=${ROUTERAI_URL:-https://routerai.ru/api/v1}
      - ROUTERAI_API_KEY=${ROUTERAI_API_KEY:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - EMBEDDING_DOCS_MODEL=${EMBEDDING_DOCS_MODEL:-intfloat/multilingual-e5-base}
      - EMBEDDING_TICKETS_MODEL=${EMBEDDING_TICKETS_MODEL:-qwen/qwen3-embedding-4b}
    volumes:
      - ./backend:/app
      - embedding_cache:/root/.cache
    restart: unless-stopped
    networks:
      - parts-ai-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: parts-ai-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - parts-ai-network

volumes:
  embedding_cache:

networks:
  parts-ai-network:
    driver: bridge