server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Встроенный DNS Docker'а. Нужен, чтобы имя backend пере-резолвилось:
    # без resolver'а nginx запоминает IP один раз при старте, и после
    # пересоздания backend-контейнера (Watchtower / autoheal / redeploy стека)
    # фронт отдаёт 502 до собственного перезапуска.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Фронтенд
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксирование API на backend
    location /api/ {
        # proxy_pass с переменной + resolver => имя пере-резолвится каждые 10 с
        set $backend_upstream "http://backend:8000";
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
