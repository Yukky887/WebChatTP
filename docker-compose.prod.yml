# docker-compose.prod.yml
# Продовый стек. Образы тянутся из GHCR (промоут из staging теми же тегами).
#
# Значения переменных задаются:
#   - в Portainer: Stacks -> <stack> -> Environment variables (рекомендуется)
#   - локально:    docker compose --env-file .env.production -f docker-compose.prod.yml up -d
#
# IMAGE_TAG определяет, какую версию образов тянуть (latest / vX.Y.Z / sha-xxxxxxx).
# Для отката достаточно поменять IMAGE_TAG на предыдущий тег и перезапустить стек.
services:
  postgres:
    image: postgres:16-alpine
    container_name: parts-ai-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - parts-ai-network-prod

  backend:
    image: ghcr.io/yukky887/webchattp-backend:${IMAGE_TAG:-latest}
    container_name: parts-ai-backend-prod
    environment:
      # DSN собирает backend из POSTGRES_* (с URL-кодированием пароля),
      # см. backend/config.py: build_database_url()
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      QDRANT_URL: ${QDRANT_URL}
      WEAVIATE_URL: ${WEAVIATE_URL}
      OLLAMA_URL: ${OLLAMA_URL}
      LLAMACPP_URL: ${LLAMACPP_URL}
      ROUTERAI_URL: ${ROUTERAI_URL}
      ROUTERAI_API_KEY: ${ROUTERAI_API_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      EMBEDDING_DOCS_MODEL: ${EMBEDDING_DOCS_MODEL}
      EMBEDDING_TICKETS_MODEL: ${EMBEDDING_TICKETS_MODEL}
    # Watchtower перезапустит контейнер, когда в GHCR обновится образ :latest
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: prod
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - embedding_cache_prod:/root/.cache
    restart: unless-stopped
    healthcheck:
      # bge-m3 (~2 ГБ) грузится на старте, на первом запуске — ещё и скачивается
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 900s
      retries: 5
    networks:
      - parts-ai-network-prod

  frontend:
    image: ghcr.io/yukky887/webchattp-frontend:${IMAGE_TAG:-latest}
    container_name: parts-ai-frontend-prod
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: prod
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - parts-ai-network-prod

  # Автодеплой прода: подтягивает новый :latest после ручного промоута
  # (workflow "Deploy to Production"). Работает внутри сети.
  watchtower:
    image: nickfedor/watchtower:1.23.1
    container_name: parts-ai-watchtower-prod
    environment:
      WATCHTOWER_SCOPE: prod
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_CLEANUP: "true"
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - parts-ai-network-prod

volumes:
  embedding_cache_prod:
  postgres_data_prod:

networks:
  parts-ai-network-prod:
    driver: bridge
