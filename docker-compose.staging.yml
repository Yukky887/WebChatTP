# docker-compose.staging.yml
# Стек тестового (pre-prod) стенда. Образы тянутся из GHCR с тегом :staging.
#
# Значения переменных задаются:
#   - в Portainer: Stacks -> <stack> -> Environment variables (рекомендуется)
#   - локально:    docker compose --env-file .env.staging -f docker-compose.staging.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: parts-ai-postgres-staging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      # даём инициализации (initdb на пустом volume) спокойно доехать,
      # иначе autoheal может прибить postgres прямо во время initdb
      start_period: 60s
    labels:
      autoheal: "true"
    restart: unless-stopped
    networks:
      - parts-ai-network-staging

  backend:
    image: ghcr.io/yukky887/webchattp-backend:staging
    container_name: parts-ai-backend-staging
    environment:
      # DSN собирает backend из POSTGRES_* (с URL-кодированием пароля),
      # см. backend/config.py: build_database_url()
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      QDRANT_URL: ${QDRANT_URL}
      WEAVIATE_URL: ${WEAVIATE_URL}
      OLLAMA_URL: ${OLLAMA_URL}
      LLAMACPP_URL: ${LLAMACPP_URL}
      ROUTERAI_URL: ${ROUTERAI_URL}
      ROUTERAI_API_KEY: ${ROUTERAI_API_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      EMBEDDING_DOCS_MODEL: ${EMBEDDING_DOCS_MODEL}
      EMBEDDING_TICKETS_MODEL: ${EMBEDDING_TICKETS_MODEL}
    # Watchtower перезапустит контейнер, когда в GHCR появится новый образ :staging
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: staging
      autoheal: "true"
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - embedding_cache_staging:/root/.cache
    restart: unless-stopped
    healthcheck:
      # bge-m3 (~2 ГБ) грузится на старте, на первом запуске — ещё и скачивается
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 900s
      retries: 5
    networks:
      - parts-ai-network-staging

  frontend:
    image: ghcr.io/yukky887/webchattp-frontend:staging
    container_name: parts-ai-frontend-staging
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: staging
      autoheal: "true"
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    depends_on:
      backend:
        condition: service_started
    # nginx отдаёт статику и проксирует /api — если он «завис», autoheal
    # перезапустит контейнер. Недоступность backend тут не проверяется
    # специально: это не повод перезапускать фронт.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - parts-ai-network-staging

  # Автодеплой стенда: опрашивает GHCR и перезапускает backend/frontend,
  # когда меняется образ :staging. Работает внутри сети — GitHub сюда не достаёт.
  watchtower:
    image: nickfedor/watchtower:1.23.1
    container_name: parts-ai-watchtower-staging
    environment:
      WATCHTOWER_SCOPE: staging
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      WATCHTOWER_CLEANUP: "true"
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - parts-ai-network-staging

  # Авто-восстановление (авто-поднятие): перезапускает контейнеры, которые
  # Docker признал unhealthy. `restart: unless-stopped` лечит только падение
  # процесса, а «процесс жив, но приложение не отвечает» — нет.
  autoheal:
    # тег не версионируется апстримом, поэтому пиним digest (проверен на демоне
    # Engine 29.2.1 / MinAPIVersion 1.44: старое autoheal:1.2.0 с ним не работает)
    image: willfarrell/autoheal@sha256:8a79b7fc9654f8bc9785330c90791f4bb6688f4f749bb42a00844023f5c2ccd0
    container_name: parts-ai-autoheal-staging
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "30"
      AUTOHEAL_START_PERIOD: "60"
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: "30"
      # не поднимаем то, что остановлено руками (обслуживание/отладка)
      AUTOHEAL_ONLY_MONITOR_RUNNING: "true"
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - parts-ai-network-staging

volumes:
  embedding_cache_staging:
  postgres_data_staging:

networks:
  parts-ai-network-staging:
    driver: bridge
