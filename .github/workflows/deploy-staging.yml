name: Deploy to Staging

# Автоматический деплой на тестовый стенд при пуше в develop.
# Сначала собираются и пушатся образы в GHCR, затем Portainer перезапускает стек webcheckdb-staging.
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: yukky887/webchattp-backend
  IMAGE_FRONTEND: yukky887/webchattp-frontend

jobs:
  build-and-push:
    name: Build & Push images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=staging

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=staging

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Trigger Portainer redeploy
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    env:
      # Секреты нельзя использовать в `if`, поэтому прокидываем через env.
      PORTAINER_WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK_STAGING }}
    steps:
      - name: Trigger Portainer stack webhook
        if: env.PORTAINER_WEBHOOK != ''
        run: |
          echo "🚀 Триггерим Portainer webhook (staging)..."
          curl -fsS -X POST "$PORTAINER_WEBHOOK"
          echo "✅ Webhook отправлен"

      - name: No webhook configured
        if: env.PORTAINER_WEBHOOK == ''
        run: |
          echo "⚠️ Секрет PORTAINER_WEBHOOK_STAGING не задан — автодеплой пропущен."
          echo "Настрой Portainer webhook и добавь секрет, см. docs/CI-CD.md"

      - name: Wait for stack to restart
        if: env.PORTAINER_WEBHOOK != ''
        run: sleep 45

      - name: Smoke test (/api/health)
        if: ${{ vars.STAGING_URL != '' }}
        run: |
          echo "🔍 Проверяем ${{ vars.STAGING_URL }}/api/health"
          for i in $(seq 1 10); do
            if curl -fsS --max-time 10 "${{ vars.STAGING_URL }}/api/health" > /dev/null; then
              echo "✅ Staging отвечает"
              exit 0
            fi
            echo "Попытка $i не удалась, ждём 10с..."
            sleep 10
          done
          echo "❌ Staging не ответил на /api/health"
          exit 1
