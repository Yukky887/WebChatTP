name: Deploy to Staging

# Сборка и публикация образов :staging при пуше в develop.
#
# Доставку на стенд выполняет Watchtower внутри самого стека (сервис
# `watchtower` в docker-compose.staging.yml): он раз в 5 минут опрашивает GHCR и
# перезапускает backend/frontend, когда меняется образ :staging.
#
# Почему не webhook/Portainer API: sup5.tradesoft.corp — внутренний хост, а
# GitHub-hosted раннеры находятся в интернете и его не видят, поэтому прямой
# запрос к Portainer из workflow невозможен. Watchtower же крутится внутри сети.
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: yukky887/webchattp-backend
  IMAGE_FRONTEND: yukky887/webchattp-frontend

jobs:
  build-and-push:
    name: Build & Push images (:staging)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}
          tags: |
            type=raw,value=staging
            type=sha,prefix=sha-

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}
          tags: |
            type=raw,value=staging
            type=sha,prefix=sha-

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### ✅ Образы :staging собраны и запушены"
            echo ""
            echo "- \`ghcr.io/yukky887/webchattp-backend:staging\` (sha-${{ github.sha }})"
            echo "- \`ghcr.io/yukky887/webchattp-frontend:staging\` (sha-${{ github.sha }})"
            echo ""
            echo "Watchtower в стеке staging подхватит новый образ в течение ~5 минут."
            echo "Проверка вручную: http://sup5.tradesoft.corp:3001/api/health"
          } >> "$GITHUB_STEP_SUMMARY"
