name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  # ==================== BACKEND ====================
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: partsai
          POSTGRES_PASSWORD: partsai_secret
          POSTGRES_DB: partsai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U partsai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://partsai:partsai_secret@localhost:5432/partsai_test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # CPU-only torch для скорости
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          pip install pytest pytest-asyncio ruff

      - name: Check syntax
        working-directory: ./backend
        run: |
          python -m py_compile main.py
          python -m py_compile config.py
          python -m py_compile models.py

      - name: Lint with ruff (опционально)
        working-directory: ./backend
        continue-on-error: true
        run: ruff check .

      - name: Lint with flake8 (опционально)
        working-directory: ./backend
        continue-on-error: true
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Apply migrations (Alembic)
        working-directory: ./backend
        run: alembic upgrade head

      - name: Run tests
        working-directory: ./backend
        run: pytest -q

  # ==================== FRONTEND ====================
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Type check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: ./frontend
        run: npm run build
        env:
          CI: false

      - name: Test
        working-directory: ./frontend
        run: CI=true npm test -- --watchAll=false --passWithNoTests
        continue-on-error: true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/
